<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>

  <script src="https://cdn.tailwindcss.com"></script>

</head>

  <body class="bg-gray-100">

  <header class="bg-blue-600 text-white sticky top-0 z-50">

    <div class="max-w-6xl mx-auto flex justify-between items-center p-5">

      <h1 class="text-2xl font-bold">
        My Portfolio
      </h1>

      <nav class="space-x-5">
        <a href="index.html" class="hover:text-yellow-300">Home</a>
        <a href="about.html" class="hover:text-yellow-300">About</a>
        <a href="contact.html" class="text-yellow-300 font-semibold">Contact</a>
      </nav>

    </div>

  </header>


  <main class="min-h-[85vh]">
    <section class="max-w-xl mx-auto py-16 px-5">
    
      <h2 class="text-4xl font-bold mb-8">
        Contact Us
      </h2>
      
      <form class="space-y-5">
      
      <input
        type="text"
        placeholder="Your Name"
        class="w-full border p-3 rounded"
      />
      
      <input
        type="email"
        placeholder="Your Email"
        class="w-full border p-3 rounded"
      />
    
      <textarea
        placeholder="Message"
        rows="5"
        class="w-full border p-3 rounded"
      ></textarea>
    
      <button class="bg-blue-600 hover:bg-blue-700 duration-300 text-white px-6 py-3 rounded">
        Send Message
      </button>
    
      </form>
    
    </section>

  </main>



  <footer class="bg-gray-800 text-white text-center py-6">
    © 2026 My Portfolio
  </footer>

</body>
</html>
