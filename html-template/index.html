<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Portfolio</title>

  <script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="bg-gray-100">

  <!-- Header -->

  <header class="bg-blue-600 text-white sticky top-0 z-50">

      <div class="max-w-6xl mx-auto flex justify-between items-center p-5">

          <h1 class="text-2xl font-bold">
              My Portfolio
          </h1>

          <nav class="space-x-5">
              <a href="index.html" class="text-yellow-300 font-semibold">Home</a>
              <a href="about.html" class="hover:text-yellow-300">About</a>
              <a href="contact.html" class="hover:text-yellow-300">Contact</a>
          </nav>

      </div>

  </header>


  <main class="min-h-[85vh]">
    <!-- Hero -->
    <section class="max-w-6xl mx-auto py-16 px-5">

        <div class="grid md:grid-cols-2 gap-10 items-center">

            <div>

                <h2 class="text-5xl font-bold mb-5">
                    Welcome To My Website
                </h2>

                <p class="text-gray-600 mb-6">
                    This is a simple HTML template. Later we will convert this into React.
                </p>

                <button class="bg-blue-600 hover:bg-blue-700 duration-300 text-white px-6 py-3 rounded">
                    Learn More
                </button>

            </div>

            <div>

                <img
                    src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=800"
                    class="rounded-lg w-full"
                >

            </div>

        </div>

    </section>
    <!-- Services -->
    <section class="bg-white py-16">

        <div class="max-w-6xl mx-auto px-5">

            <h2 class="text-4xl font-bold text-center mb-10">
                Our Services
            </h2>

            <div class="grid md:grid-cols-3 gap-6">

                <div class="bg-gray-100 p-6 rounded shadow hover:-translate-y-2 duration-300">

                    <h3 class="text-xl font-bold mb-3">
                        Web Design
                    </h3>

                    <p>
                        Beautiful and responsive website.
                    </p>

                </div>

                <div class="bg-gray-100 p-6 rounded shadow hover:-translate-y-2 duration-300">

                    <h3 class="text-xl font-bold mb-3">
                        Development
                    </h3>

                    <p>
                        Fast and secure web applications.
                    </p>

                </div>

                <div class="bg-gray-100 p-6 rounded shadow hover:-translate-y-2 duration-300">

                    <h3 class="text-xl font-bold mb-3">
                        SEO
                    </h3>

                    <p>
                        Improve your Google ranking.
                    </p>

                </div>

            </div>

        </div>

    </section>
  </main>



  <!-- Footer -->

  <footer class="bg-gray-800 text-white text-center py-6 mt-10">
    © <script>document.write(new Date().getFullYear())</script> My Portfolio
  </footer>

</body>
</html>
